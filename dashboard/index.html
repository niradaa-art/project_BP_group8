
<!doctype html>
<html lang="th" style="color-scheme:dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แดชบอร์ดงบประมาณรายจังหวัด × GPP</title>
<style>/* Design tokens extracted from docs/design-reference.png */
:root{
  --bg:#0c0614; --bg-glow:#2a0f45;
  --panel:rgba(32,17,56,.72); --panel-edge:rgba(196,120,255,.28);
  --text:#f4eaff; --muted:#b9a6d6;
  --magenta:#e23cf5; --violet:#8f6bff; --lilac:#c9b2ff; --cyan:#46c8ff;
  --warn:#ffb454; --danger:#ff6b8a; --ok:#5eead4;
  --radius-panel:16px; --radius-chip:8px;
  --font:"Noto Sans Thai","Sarabun","Segoe UI",system-ui,sans-serif;
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.5rem; --fs-xl:2.25rem;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--text);min-height:100vh;padding-top:env(safe-area-inset-top,0);
  background:radial-gradient(900px 500px at 15% -10%,#3a1466 0%,transparent 60%),radial-gradient(800px 600px at 100% 100%,#4a0f5c 0%,transparent 55%),var(--bg);background-attachment:fixed}
.shell{display:grid;grid-template-columns:210px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
.panel{position:relative;background:linear-gradient(155deg,rgba(66,36,108,.62),rgba(22,11,40,.82));border:1px solid var(--panel-edge);border-radius:var(--radius-panel);padding:16px;
  box-shadow:0 14px 32px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.14) inset,0 0 0 1px rgba(255,255,255,.03) inset;backdrop-filter:blur(10px);transition:transform .2s,box-shadow .2s;min-width:0}
.panel:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.18) inset,0 0 30px rgba(226,60,245,.14)}
.panel h2{margin:0 0 4px;font-size:var(--fs-md);font-weight:600}
.ins{margin:0 0 12px;color:var(--lilac);font-size:var(--fs-sm)}.note{color:var(--muted);font-size:var(--fs-xs);margin:8px 0 0}.muted{color:var(--muted);font-size:var(--fs-sm)}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:8px;padding:16px;background:linear-gradient(160deg,rgba(66,36,108,.6),rgba(22,11,40,.85));border:1px solid var(--panel-edge);border-radius:var(--radius-panel);box-shadow:0 14px 32px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.14) inset}
.side h1{font-size:var(--fs-md);margin:0 0 8px}
.side button{all:unset;cursor:pointer;padding:10px 12px;border-radius:var(--radius-chip);color:var(--muted);font-size:var(--fs-sm);transition:background .2s}
.side button:hover{background:rgba(143,107,255,.15)}
.side button.on{background:linear-gradient(90deg,var(--magenta),var(--violet));color:#fff;box-shadow:0 0 18px rgba(226,60,245,.45)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:16px;align-items:start}
.row>*{grid-column:span 12}.row>.c3{grid-column:span 3}.row>.c4{grid-column:span 4}.row>.c5{grid-column:span 5}.row>.c6{grid-column:span 6}.row>.c7{grid-column:span 7}.row>.c12{grid-column:span 12}
.row>.ctl,.row>.chip,.row>.chipbar{grid-column:auto;justify-self:start}.row:has(>.ctl),.row:has(>.chipbar){display:flex;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:16px}
.kpi .l{color:var(--muted);font-size:var(--fs-sm)}.kpi .v{font-size:var(--fs-xl);font-weight:700;line-height:1.2;margin:6px 0;text-shadow:0 0 22px rgba(226,60,245,.5);overflow-wrap:anywhere}.kpi .s{color:var(--lilac);font-size:var(--fs-xs)}
.ringbox{display:grid;justify-items:center;text-align:center;gap:4px}.ringbox svg{width:124px;overflow:visible}.ringbox .l{font-weight:600;font-size:var(--fs-sm)}.ringbox .s{color:var(--muted);font-size:var(--fs-xs)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chips span{padding:4px 12px;border-radius:999px;background:rgba(143,107,255,.14);border:1px solid var(--panel-edge);font-size:var(--fs-xs);color:var(--lilac)}
.chips .w{color:var(--warn);border-color:var(--warn)}.chips .ok{color:var(--ok)}
.ctl{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:var(--fs-sm)}
select{background:#1d0f33;color:var(--text);border:1px solid var(--panel-edge);border-radius:var(--radius-chip);padding:6px 10px;font:inherit}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}.chip{font:inherit;font-size:var(--fs-sm);color:var(--muted);background:rgba(143,107,255,.12);border:1px solid var(--panel-edge);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip.on{color:#fff;background:linear-gradient(90deg,var(--magenta),var(--violet));box-shadow:0 0 16px rgba(226,60,245,.4)}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:22px minmax(90px,200px) 1fr minmax(64px,auto);gap:8px;align-items:center;font-size:var(--fs-sm)}
.bar .rk{color:var(--muted);font-size:var(--fs-xs);text-align:right}.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .vl{text-align:right;color:var(--lilac)}
.trk{height:12px;border-radius:8px;background:rgba(143,107,255,.12);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.trk i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#8f6bff,#e23cf5);box-shadow:0 0 12px rgba(226,60,245,.6),inset 0 1px 0 rgba(255,255,255,.4);animation:grow .7s ease-out}
@keyframes grow{from{width:0}}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.donut svg{width:190px;flex:none}.donut ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1 1 150px;min-width:0;font-size:var(--fs-sm)}
.donut li{min-width:0;display:flex;gap:8px;align-items:center}.donut li b{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:0 0 8px currentColor}.donut li em{min-width:0;font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.donut li span{color:var(--lilac)}
.chart{width:100%;height:auto}.map{width:100%;max-height:560px;height:auto;display:block;margin:auto}
.legend{display:flex;gap:8px;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--muted);margin-top:8px}.legend i{width:140px;height:8px;border-radius:6px;box-shadow:0 0 10px rgba(226,60,245,.4)}
.lg{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px;font-size:var(--fs-xs)}.lg span{color:var(--muted)}
.warn{border-color:var(--warn)}.block{border-color:var(--danger)}.panel.warn{margin-bottom:16px;color:var(--warn)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.upload{padding:12px 16px;margin-bottom:16px}.upload summary{cursor:pointer;font-weight:600}.upload .files{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0}.upload label{font-size:var(--fs-sm);color:var(--muted);display:grid;gap:4px}
#tip{position:fixed;display:none;pointer-events:none;z-index:99;background:rgba(18,8,32,.96);border:1px solid var(--panel-edge);padding:6px 10px;border-radius:8px;font-size:var(--fs-sm);max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media(max-width:1000px){.row>.c3{grid-column:span 6}.row>.c4,.row>.c5,.row>.c6,.row>.c7{grid-column:span 12}}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:static;flex-direction:row;flex-wrap:wrap}.side h1{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* --- v3: search, drawer, emoji KPIs, map, hero --- */
.topbar{position:sticky;top:0;z-index:20;padding:8px 0 12px;margin-bottom:4px}
.search{position:relative;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:linear-gradient(155deg,rgba(66,36,108,.8),rgba(22,11,40,.92));border:1px solid var(--panel-edge);box-shadow:0 10px 24px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.14) inset;backdrop-filter:blur(10px)}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:var(--fs-md);outline:0;min-width:0}.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--magenta),0 0 24px rgba(226,60,245,.35)}
#qres{position:absolute;left:0;right:0;top:calc(100% + 6px);list-style:none;margin:0;padding:6px;border-radius:16px;background:rgba(20,10,36,.97);border:1px solid var(--panel-edge);box-shadow:0 18px 40px rgba(0,0,0,.6);max-height:340px;overflow:auto}
#qres:empty{display:none}#qres li{padding:8px 12px;border-radius:10px;cursor:pointer;font-size:var(--fs-sm)}#qres li:hover,#qres li:focus{background:rgba(143,107,255,.22);outline:0}#qres small{color:var(--muted);margin-left:6px}#qres .none{color:var(--muted);cursor:default}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px;background:linear-gradient(120deg,rgba(226,60,245,.28),rgba(70,200,255,.12) 55%,rgba(22,11,40,.8))}
.hero h1{margin:0 0 6px;font-size:var(--fs-lg);text-shadow:0 0 24px rgba(226,60,245,.6)}.hero p{margin:0;color:var(--lilac);font-size:var(--fs-sm);max-width:62ch}
.hero-e{display:flex;gap:10px;font-size:2rem}.hero-e span{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:0 8px 20px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.2) inset,0 0 20px rgba(226,60,245,.25);animation:float 4s ease-in-out infinite}
.hero-e span:nth-child(2){animation-delay:.5s}.hero-e span:nth-child(3){animation-delay:1s}.hero-e span:nth-child(4){animation-delay:1.5s}@keyframes float{50%{transform:translateY(-6px)}}
.kpi{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}.kpi .ico{grid-row:1/3;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,rgba(226,60,245,.4),rgba(143,107,255,.35));box-shadow:0 0 18px rgba(226,60,245,.4),0 1px 0 rgba(255,255,255,.3) inset}
.kpi .l{align-self:end}.kpi .v{grid-column:1/3;background:linear-gradient(90deg,#fff,#f3c9ff 55%,#c9b2ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(226,60,245,.5));font-size:2.4rem;font-weight:800;letter-spacing:-.5px}.kpi .s{grid-column:1/3}
.ringico{position:absolute;top:10px;left:14px;font-size:1.3rem}
.clk,[data-prov],[data-grp],[data-party],[data-region]{cursor:pointer}.bar.clk:hover{background:rgba(143,107,255,.14);border-radius:8px}.lg li.clk:hover,.donut li.clk:hover{color:#fff;text-shadow:0 0 10px rgba(226,60,245,.8)}
.panel.clk:hover{box-shadow:0 20px 40px rgba(0,0,0,.5),0 0 34px rgba(226,60,245,.3)}
.shp{stroke:rgba(12,6,20,.9);stroke-width:1;transition:filter .15s}.shp:hover{stroke:#fff;stroke-width:1.8;filter:brightness(1.3) drop-shadow(0 0 8px rgba(255,255,255,.6))}.shp.sel{stroke:#fff;stroke-width:2.4;filter:drop-shadow(0 0 10px #e23cf5)}
.map{max-height:640px}.map.mini{max-height:280px;pointer-events:auto}
.regcards{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}@media(max-width:1250px){.regcards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}.regcard{border-top:3px solid var(--c)}.regcard .rt{display:flex;gap:8px;align-items:center;font-size:var(--fs-sm)}.regcard .em{font-size:1.6rem}.regcard .rv{font-size:2rem;font-weight:800;color:#fff;text-shadow:0 0 18px var(--c)}
.chipbar{display:inline-flex}.chip{transition:transform .15s}.chip:hover{transform:translateY(-1px)}
#scrim{position:fixed;inset:0;background:rgba(5,2,12,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:50;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:linear-gradient(170deg,#2a1450,#120824 70%);border-left:1px solid var(--panel-edge);box-shadow:-20px 0 60px rgba(0,0,0,.6);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#drawer.open{transform:none}#dclose{position:absolute;top:12px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--panel-edge);background:rgba(143,107,255,.2);color:#fff;font-size:1rem;cursor:pointer}
#dbody{overflow:auto;padding:20px 20px 40px;flex:1}#dbody h3{margin:22px 0 8px;font-size:var(--fs-md)}
.dh{display:flex;gap:14px;align-items:center;padding-right:44px}.dh h2{margin:0 0 6px;font-size:var(--fs-lg);text-shadow:0 0 20px rgba(226,60,245,.5)}.demo{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,rgba(226,60,245,.45),rgba(143,107,255,.35));box-shadow:0 0 22px rgba(226,60,245,.45)}
.dh .chips{margin:0}.dh .chips .clk:hover{background:rgba(226,60,245,.3)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.stat{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(143,107,255,.12);border:1px solid var(--panel-edge);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}.si{font-size:1.4rem}.sl{font-size:var(--fs-xs);color:var(--muted)}.sv{font-size:1.35rem;font-weight:800;color:#fff;text-shadow:0 0 14px rgba(226,60,245,.45);overflow-wrap:anywhere}
.minimap{display:grid;place-items:center;padding:8px;border-radius:14px;background:rgba(0,0,0,.2)}.bigem{font-size:3rem;margin-bottom:8px}
.radar{max-width:520px;display:block;margin:auto}.lg li b{margin-right:2px}
@media(max-width:800px){.hero{flex-direction:column;align-items:flex-start}.kpi .v{font-size:2rem}}
/* --- v4: linked selection, simulator --- */
#selbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:8px;padding:8px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(70,200,255,.22),rgba(226,60,245,.2));border:1px solid rgba(70,200,255,.55);box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 20px rgba(70,200,255,.2);backdrop-filter:blur(10px);font-size:var(--fs-sm)}
#selbar[hidden]{display:none}#selbar .sb-t{font-weight:800;font-size:var(--fs-md)}#selbar .sb-c{padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.1)}#selbar .sb-h{color:var(--muted);flex-basis:100%;font-size:var(--fs-xs)}
.bar.on{background:linear-gradient(90deg,rgba(70,200,255,.22),rgba(70,200,255,.04));border-radius:8px;box-shadow:0 0 0 1px rgba(70,200,255,.6)}.bar.on .nm{font-weight:800;color:#fff}.bar.on .trk i{background:linear-gradient(90deg,#46c8ff,#e23cf5)}
.lg li.on,.regcard.on{box-shadow:0 0 0 2px #46c8ff,0 0 24px rgba(70,200,255,.4);border-radius:10px}.regcard.on{border-radius:var(--radius-panel)}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.noanim .trk i,.noanim .hero-e span{animation:none}
.linknote{margin-bottom:16px;border-color:#46c8ff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.simctl{margin-bottom:16px}.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:16px 0}
.sl{display:grid;gap:6px;font-size:var(--fs-sm)}.sl span{display:flex;justify-content:space-between}.sl b{color:#fff;text-shadow:0 0 12px rgba(226,60,245,.7)}.sl small{color:var(--muted);font-size:var(--fs-xs)}
input[type=range]{accent-color:#e23cf5;width:100%}
.chips .clk{cursor:pointer}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f6bff"/><stop offset="1" stop-color="#e23cf5"/></linearGradient>
<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e23cf5" stop-opacity=".55"/><stop offset="1" stop-color="#8f6bff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
<div id="tip" role="tooltip"></div>
<div class="shell">
  <nav class="side" aria-label="เมนูหลัก">
    <h1>🇹🇭 งบประมาณรายจังหวัด</h1>
    <button data-page="overview" class="on">🏠 ภาพรวม</button>
    <button data-page="deep">🔍 เจาะลึกงบประมาณ</button>
    <button data-page="gpp">📈 งบประมาณ × GPP</button>
    <button data-page="region">🌏 ภูมิภาค</button>
    <button data-page="sim">🧮 จำลองการจัดสรรงบ</button>
    <button data-page="party">🗳️ พรรค × GPP</button>
  </nav>
  <main>
    <div class="topbar"><div class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="ค้นหาจังหวัด ภาค พรรค หรือหน่วยงาน เช่น เชียงใหม่" autocomplete="off" aria-label="ค้นหา"><ul id="qres" role="listbox" aria-label="ผลการค้นหา"></ul></div><div id="selbar" hidden></div></div>
    <details class="panel upload" id="up" open>
      <summary>นำเข้าข้อมูล <span id="src" class="muted"></span></summary>
      <div class="files">
      <label>provincial_budget.csv <input type="file" id="f-budget" accept=".csv,.txt"></label>
      <label>gdp.csv <input type="file" id="f-gdp" accept=".csv"></label>
      <label>partylist.csv <input type="file" id="f-party" accept=".csv"></label>
      </div>
      <p class="muted">ไฟล์ถูกประมวลผลในเบราว์เซอร์เท่านั้น ไม่มีการอัปโหลดไปเซิร์ฟเวอร์</p>
    </details>
    <div id="view" aria-live="polite"></div>
  </main>
</div>

function regionHTML(name) {

function groupHTML(dim, value) {

function partyHTML(name) {

  return `<div class="dh"><div class="demo" aria-hidden="true">🗳️</div><div><h2 id="dt">${esc(name)}</h2><div class="chips"><span>${g.n} จังหวัด</span>${g.small ? '<span class="w">⚠ ตัวอย่างน้อย</span>' : ''}</div></div></div>
  <div class="statgrid">${stat('📍', 'จำนวนจังหวัด', cnt(g.n))}${stat('💎', 'GPP ต่อหัว มัธยฐาน (บาท)', cnt(g.medianPc, 0))}${stat('📈', 'การเติบโต มัธยฐาน (%)', cnt(g.medianGrowth, 2))}${stat('📊', 'การเติบโต เฉลี่ย (%)', cnt(g.meanGrowth, 2))}</div>

function topHTML(n) {

let lastFocus = null;
function openDrawer(html) { lastFocus = document.activeElement; dbody.innerHTML = html; drawer.classList.add('open'); scrim.classList.add('on'); drawer.setAttribute('aria-hidden', 'false'); dbody.scrollTop = 0; countUp(dbody); setTimeout(() => $('#dclose').focus(), 60); }

$('#dclose').onclick = closeDrawer; scrim.onclick = closeDrawer; document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
/** data-pick selects a province (links all charts); data-prov selects + opens details; other data-* open details only. */

  if (d.pick) { S.sel = S.sel === d.pick ? null : d.pick; render(false); return; }
  if (d.prov) { S.sel = d.prov; render(false); openDrawer(provinceHTML(d.prov)); return; }
  if (d.open) openDrawer(provinceHTML(d.open)); else if (d.region && S.gdp) openDrawer(regionHTML(d.region)); else if (d.party) openDrawer(partyHTML(d.party));

const SEL = '[data-pick],[data-prov],[data-open],[data-grp],[data-party],[data-region],[data-top],[data-yr]';
document.addEventListener('click', e => { const t = e.target.closest(SEL); if (t) { act(t); $('#qres').innerHTML = ''; } });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.(SEL) && e.target.getAttribute('role') === 'button') { e.preventDefault(); act(e.target); } });
function renderSelBar() {

  if (i < 0) { el.hidden = true; el.innerHTML = ''; if (S.sel) S.sel = null; return; }
  const p = o.byProv[i], b = bg()?.rows.find(r => r.key === S.sel), reg = rm().get(S.sel);

  $('#selclear').onclick = () => { S.sel = null; render(false); };

/* ---------- search ---------- */
function searchIndex() {
  return S.cache.si ??= (() => { const L = []; for (const p of ov().byProv) L.push({ t: 'prov', k: p.key, l: disp(p.label), x: rm().get(p.key) ?? '' });
    for (const n of new Set(rm().values())) L.push({ t: 'region', k: n, l: n, x: '' }); for (const n of new Set(pmap().values())) L.push({ t: 'party', k: n, l: n, x: '' });
    for (const a of new Set(S.budget.map(r => r.agc_name))) if (a) L.push({ t: 'grp', k: 'agc_name::' + a, l: a, x: '' }); return L; })();
}
const ICON = { prov: '📍', region: '🌏', party: '🗳️', grp: '🏛️' }, ATTR = { prov: 'data-prov', region: 'data-region', party: 'data-party', grp: 'data-grp' };
function runSearch() {
  const q = $('#q').value.replace(/\s/g, '').toLowerCase(), box = $('#qres'); if (!q) { box.innerHTML = ''; return; }
  if (!S.budget) { box.innerHTML = '<li class="none">ยังไม่มีข้อมูล — อัปโหลดไฟล์ก่อน</li>'; return; }
  const nz = s => s.replace(/\s/g, '').toLowerCase(), m = searchIndex().filter(i => nz(i.l).includes(q)), order = { prov: 0, region: 1, party: 2, grp: 3 };
  m.sort((a, b) => (order[a.t] - order[b.t]) || (nz(a.l).startsWith(q) ? 0 : 1) - (nz(b.l).startsWith(q) ? 0 : 1));
  box.innerHTML = m.slice(0, 10).map(i => `<li role="option" tabindex="0" ${ATTR[i.t]}="${esc(i.k)}">${ICON[i.t]} ${esc(i.l)} <small>${esc(i.x)}</small></li>`).join('') || '<li class="none">ไม่พบผลลัพธ์</li>';
}
$('#q').addEventListener('input', runSearch);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const f = $('#qres li[role=option]'); if (f) { act(f); $('#qres').innerHTML = ''; $('#q').blur(); } } if (e.key === 'Escape') { $('#q').value = ''; $('#qres').innerHTML = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#qres').innerHTML = ''; });

function countUp(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count, d = +el.dataset.dec || 0, t0 = performance.now(); const step = t => { const k = Math.min(1, (t - t0) / 800); el.textContent = f2(to * (1 - (1 - k) ** 3), d); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
}
function bindControls(rows) {
  document.querySelectorAll('[data-dim]').forEach(b => b.onclick = () => { S.dim = b.dataset.dim; render(); });
  document.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => { S.mm = b.dataset.mm; render(); });
  const sc = $('#selclear2'); if (sc) sc.onclick = () => { S.sel = null; render(false); };
  const csv = $('#csv'); if (csv) csv.onclick = () => { const { provincial } = splitBudget(rows, S.fy), d = groupSum(provincial, S.dim), txt = '\uFEFFgroup,budget,rows\n' + d.map(x => `"${String(x.label).replace(/"/g, '""')}",${x.total},${x.rows}`).join('\n');
    Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([txt], { type: 'text/csv' })), download: `budget_${S.dim}_fy${S.fy}.csv` }).click(); };
  const on = (id, fn) => { const el = $(id); if (el) el.onchange = fn; };
  on('#per', e => { S.per = e.target.value; render(false); }); on('#log', e => { S.log = e.target.checked; render(false); }); on('#exb', e => { S.exb = e.target.checked; render(false); });

  on('#hold', e => { S.sim.hold = e.target.checked; updateSim(); });
}
function render(anim = true) {
  const rows = S.budget;
  if (!rows) { view.innerHTML = `<div class="panel empty"><div class="bigem">📂</div><strong>อัปโหลด provincial_budget.csv เพื่อเริ่มต้น</strong></div>`; renderSelBar(); return; }
  if (S.fy == null) S.fy = years().pop();

render(); boot();
/** Data embedded at build time (gzip+base64) loads automatically; uploads still replace it. */
async function boot() {
  const D = window.__DATA; if (!D) return;
  const un = async b64 => new Response(new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  try { for (const [k, t] of [['budget', D.budget], ['gdp', D.gdp], ['party', D.party]]) { const x = await un(t); S[k] = parseDelimited(x, detectDelimiter(x)); }
    $('#src').textContent = '· ใช้ข้อมูลที่ฝังไว้ในไฟล์นี้ (เลือกไฟล์ใหม่เพื่อแทนที่)'; $('#up').open = false; S.cache = {}; render();
  } catch (e) { view.innerHTML = empty('โหลดข้อมูลที่ฝังไว้ไม่สำเร็จ: ' + esc(e.message)); }
